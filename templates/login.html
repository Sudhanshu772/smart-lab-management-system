{% extends "base.html" %}
{% block title %}Log in · SmartLab{% endblock %}
{% block content %}
<div class="form-wrap">
  <div class="form-heading"><span class="eyebrow">WELCOME BACK</span><h1>Log in</h1><p>Continue to your lab workspace.</p></div>
  <form method="post" class="panel form-panel">
    <label>Email address<input type="email" name="email" required autocomplete="email"></label>
    <label>Password<input type="password" name="password" required autocomplete="current-password"></label>
    <button class="button primary full" type="submit">Log in</button>
    <p class="form-foot">New to SmartLab? <a href="{{ url_for('register') }}">Create an account</a></p>
  </form>
</div>
{% endblock %}
